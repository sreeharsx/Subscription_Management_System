{% extends "base.html" %}
{% block title %}404 Not Found | BrightLoop{% endblock %}
{% block page_title %}Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center pt-5">
  <div class="col-md-6 text-center">
    <div class="form-card py-5">
      <div class="stat-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem; background: #ede9fe; color: #7c3aed; border-radius: 16px; display: flex; align-items: center; justify-content: center;">
        <i class="bi bi-compass"></i>
      </div>
      <h3 class="fw-bold text-dark mb-2">404 — Page Not Found</h3>
      <p class="text-muted mb-4">
        The requested record, invoice, or endpoint could not be found or has been moved.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
          <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
