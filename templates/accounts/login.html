<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BrightLoop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .brand { display: flex; align-items: center; gap: .75rem; justify-content: center; margin-bottom: 2rem; }
    .brand .logo { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #818cf8); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
    .brand h1 { font-size: 1.4rem; font-weight: 700; color: #0f172a; margin: 0; }
    .form-label { font-size: .85rem; font-weight: 600; color: #374151; }
    .btn-login { background: #6366f1; border: none; width: 100%; padding: .7rem; font-weight: 600; font-size: .95rem; border-radius: 8px; }
    .btn-login:hover { background: #4f46e5; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <div class="logo"><i class="bi bi-infinity"></i></div>
    <h1>BrightLoop</h1>
  </div>
  <p class="text-center text-muted small mb-4">Subscription Management System</p>

  {% if form.errors %}
  <div class="alert alert-danger">
    <i class="bi bi-exclamation-triangle me-2"></i>
    Invalid username or password.
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="id_username" class="form-label">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" autofocus placeholder="Enter username">
    </div>
    <div class="mb-4">
      <label for="id_password" class="form-label">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
