<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | BrightLoop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
    }
    body {
      background: radial-gradient(circle at top right, #1e293b, #0f172a 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5);
    }
    .brand-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.5rem;
      box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.4);
    }
    .form-control {
      padding: .65rem .9rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: .95rem;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem rgba(79, 70, 229, 0.2);
    }
    .btn-login {
      background: var(--primary);
      border: none;
      width: 100%;
      padding: .75rem;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      color: #fff;
      transition: all .2s;
    }
    .btn-login:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px -4px rgba(79, 70, 229, 0.5);
    }
    .credential-pill {
      background: #f1f5f9;
      border-radius: 6px;
      padding: .35rem .6rem;
      font-size: .75rem;
      cursor: pointer;
      user-select: all;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="brand-logo">
        <i class="bi bi-infinity"></i>
      </div>
      <div>
        <h3 class="fw-bold mb-0 text-dark">BrightLoop</h3>
        <span class="text-muted small">Subscription Management Platform</span>
      </div>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 mb-3 small" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <div>Invalid username or password. Please try again.</div>
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label small fw-semibold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="id_username" class="form-control border-start-0" autofocus placeholder="Enter your username" required>
        </div>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="id_password" class="form-control border-start-0" placeholder="••••••••" required>
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Portal
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size: .75rem;">
      BrightLoop Enterprise Billing System &bull; Secure Session
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
